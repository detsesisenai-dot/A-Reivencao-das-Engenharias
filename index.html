<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foresight Estratégico: Ensino Superior & Engenharias 2026-2030</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Stable Versions) -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone (Stable Version) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    
    <!-- Lucide Icons (Vanilla UMD) -->
    <script src="https://unpkg.com/lucide@0.292.0/dist/umd/lucide.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .apple-shadow {
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .apple-shadow:hover {
            box-shadow: 0 16px 40px rgba(0,0,0,0.1);
            transform: translateY(-4px);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark-glass {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Oculta scrollbar mas permite rolagem */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Animação suave para dicas de interação */
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- NATIVE ICON GENERATOR ---
        const Icon = ({ icon, size = 24, className = '', strokeWidth = 2 }) => {
            const iconNodes = window.lucide?.icons?.[icon];
            if (!iconNodes) return <svg className={className} width={size} height={size} />;
            return (
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width={size}
                    height={size}
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth={strokeWidth}
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={className}
                >
                    {iconNodes.map(([tag, attrs], i) => React.createElement(tag, { ...attrs, key: i }))}
                </svg>
            );
        };

        // --- IMAGE CARD COMPONENT ---
        const ImageCard = ({ image, icon, title, subtitle, desc, insight, source }) => {
            const [isOpen, setIsOpen] = useState(false);
            
            return (
                <div className="bg-white rounded-[2rem] overflow-hidden apple-shadow cursor-pointer flex flex-col h-full border border-gray-100/50 group" onClick={() => setIsOpen(!isOpen)}>
                    <div className="h-48 md:h-56 w-full overflow-hidden relative">
                        <img src={image} alt={title} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" loading="lazy" />
                    </div>
                    
                    <div className="p-6 md:p-8 flex-grow flex flex-col bg-white relative">
                        <div className="flex justify-between items-start mb-2">
                            <h3 className="text-xl font-bold tracking-tight text-[#1d1d1f] pr-4">{title}</h3>
                            <div className={`shrink-0 p-1.5 rounded-full transition-colors duration-300 ${isOpen ? 'bg-blue-600 text-white' : 'bg-gray-50 text-gray-400 group-hover:bg-blue-50 group-hover:text-blue-500'}`}>
                                {isOpen ? <Icon icon="minus" size={18} /> : <Icon icon="plus" size={18} />}
                            </div>
                        </div>
                        {subtitle && <p className="text-sm font-semibold text-blue-600 mb-3">{subtitle}</p>}
                        <p className="text-[#86868b] text-sm leading-relaxed mb-4">{desc}</p>
                        
                        {/* Sinalização discreta de interatividade quando fechado */}
                        {!isOpen && (
                            <div className="mt-auto pt-4 flex items-center gap-2 text-xs font-medium text-gray-400 opacity-70 group-hover:opacity-100 transition-opacity">
                                <Icon icon="mousePointerClick" size={14} />
                                <span>Clique para aprofundar</span>
                            </div>
                        )}

                        <div className={`grid transition-all duration-500 ease-in-out mt-auto
                            ${isOpen ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0 hidden'}`}>
                            <div className="overflow-hidden">
                                <div className="pt-4 border-t border-gray-100 mt-2">
                                    <div className="flex items-center gap-2 mb-2">
                                        <Icon icon="target" size={14} className="text-blue-500" />
                                        <h4 className="text-[11px] font-bold uppercase tracking-widest text-blue-500">Insight Estratégico</h4>
                                    </div>
                                    <p className="text-sm text-gray-700 leading-relaxed mb-4">{insight}</p>
                                    <p className="text-[10px] font-semibold uppercase tracking-widest text-gray-400">Fonte: {source}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- STAT CARD COMPONENT ---
        const StatCard = ({ label, value, sub, insight, source }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div onClick={() => setIsOpen(!isOpen)} className="bg-white p-6 md:p-8 rounded-3xl apple-shadow cursor-pointer relative overflow-hidden h-full flex flex-col group border border-transparent hover:border-gray-200 transition-colors">
                    <div className="flex justify-between items-start mb-4">
                        <p className="text-[#86868b] text-sm font-semibold uppercase tracking-wider">{label}</p>
                        <div className={`transition-colors duration-300 ${isOpen ? 'text-blue-600' : 'text-gray-300 group-hover:text-blue-400'}`}>

                    </div>
                    <h3 className="text-4xl md:text-5xl font-bold tracking-tight text-[#1d1d1f] mb-2">{value}</h3>
                    <p className="text-sm text-[#515154] font-medium leading-relaxed mb-2">{sub}</p>

                        <p className="mt-auto text-[11px] font-medium text-blue-500/70 group-hover:text-blue-500 transition-colors pt-4">

                            <div className="pt-4 border-t border-gray-100 bg-gray-50/50 p-4 rounded-xl">

                                <p className="text-[10px] uppercase tracking-wider text-gray-400 font-bold">Fonte: {source}</p>
                            </div>
                        </div>
                    </div>
                </div>
            )

                { image: "https://i.postimg.cc/C5yN6ztR/Alemanha.jpg", icon: "cpu", title: "Alemanha e Suíça", subtitle: "TU Munich, Fraunhofer, ETH Zurich", desc: "Indústria 5.0, Robótica Colaborativa e Bioengenharia.", insight: "Pioneira na Indústria 4.0, a Alemanha agora lidera a transição 5.0, inserindo a colaboração humano-máquina (cobots). A Suíça dita as regras globais em engenharia climática e robótica de precisão.", source: "Foresight 2026-2035" },
                { image: "https://i.postimg.cc/9046yR76/Singapura.png", icon: "network", title: "Singapura", subtitle: "NUS, NTU", desc: "Cidades Inteligentes e Gêmeos Digitais Urbanos.", insight: "Singapura possui o Gêmeo Digital mais avançado do mundo em escala nacional. Engenheiros simulam desde tráfego de drones até o impacto do aumento do nível do mar nas infraestruturas em tempo real.", source: "Foresight 2026-2035" },
            ],
            challenges: [
                { image: "https://i.postimg.cc/Y944LRdC/Fragmentacao-Geopolitica.jpg", icon: "map", title: "Fragmentação Geopolítica", subtitle: "A Nova Guerra Fria", desc: "A dependência de cadeias de suprimentos tornou-se o maior risco estratégico.", insight: "Com a crise dos semicondutores (Taiwan) e minérios raros, a engenharia foca em 'reshoring' (nacionalização da produção), exigindo o redesenho de malhas logísticas e parques fabris locais sob forte pressão estatal.", source: "WEF / Foresight" },
                { image: "https://i.postimg.cc/c43jZ8NG/Dilema.png", icon: "shieldAlert", title: "O Déficit de Confiança", subtitle: "Responsabilidade Algorítmica", desc: "Se uma ponte projetada por Inteligência Artificial falhar, de quem é a culpa?", insight: "A validação ética dos projetos gerados por IA é o desafio crítico. O mercado exige 'Auditoria de IA' para garantir que modelos algorítmicos obedeçam às leis da física e aos limites de segurança humana.", source: "Revista Ensino Superior" },
                { image: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80", icon: "lock", title: "Segurança Ciberfísica", subtitle: "Infraestruturas Hackeáveis", desc: "O risco de ataques cibernéticos a barragens e redes elétricas.", insight: "Na Indústria 4.0/5.0, infraestruturas vitais estão 100% conectadas. A engenharia moderna precisa embutir protocolos de cibersegurança e arquiteturas 'Zero Trust' diretamente no hardware e na planta industrial.", source: "WEF 2025" }
            ],
            gaps: [
                { image: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80", icon: "trendingDown", title: "O Apagão Qualitativo", subtitle: "O Perfil 'T-Shaped' Ausente", desc: "O mercado não teme mais a falta numérica de engenheiros, mas a inaptidão tecnológica.", insight: "Profissionais tradicionais não fluem em programação, IA e metodologias ágeis. A Indústria 5.0 exige perfis 'T-Shaped': base técnica profunda cruzada com habilidades transversais (dados, negócios, sustentabilidade ESG).", source: "Mútua / Confea 2023" },
                { image: "https://i.postimg.cc/T1fywDHn/Falta-de-engenheiro.png", icon: "alertOctagon", title: "A Máquina de Evasão", subtitle: "Desconexão Curricular", desc: "Taxas de abandono atingem 60% devido ao ensino árido e obsoleto.", insight: "A deficiência do Ensino Médio afasta os jovens, mas o golpe fatal é o currículo das IES, que falha em conectar o cálculo abstrato à solução de problemas práticos contemporâneos desde o primeiro semestre.", source: "Semesp / Mútua" },
                { image: "https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=800&q=80", icon: "users", title: "Endogamia e Fuga", subtitle: "O Isolamento Institucional", desc: "Contratação interna nas IES trava inovação, exportando talentos digitalmente.", insight: "A 'endogamia acadêmica' (contratar ex-alunos para docência) atinge 70% em IES de elite no Brasil, matando a diversidade. Em contrapartida, a 'Fuga de Cérebros' digital permite que os melhores talentos locais trabalhem para EUA/Europa sem sair de casa.", source: "Revista Ensino Superior / Foresight" }
            ],
            alternatives: [
                { image: "https://i.postimg.cc/RhtzjsRS/Bussula-OCDE.png", icon: "compass", title: "A Bússola OCDE 2030", subtitle: "O Ciclo AAR na Prática", desc: "Substituindo a aula expositiva pelo protagonismo ativo (Antecipação, Ação, Reflexão).", insight: "O framework remodela o tempo: 20% Antecipação (reflexão prévia), 60% Ação (resolução de problemas) e 20% Reflexão (metacognição). Força o estudante a assumir o controle do aprendizado cidadão e técnico.", source: "OCDE / Revista Ensino Superior" },
                { image: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=800&q=80", icon: "award", title: "Microcredenciais", subtitle: "O Fim do Diploma Monolítico", desc: "Certificações modulares verificáveis que substituem o currículo estático.", insight: "A 'Economia da Confiança' exige provas em tempo real (portfólios, projetos). As IES precisam oferecer trilhas 'empilháveis' (stackable) que validem habilidades ágeis demandadas pela Indústria, descentralizando o poder do diploma único.", source: "Revista Ensino Superior" },
                { image: "https://i.postimg.cc/m2qH3tcY/Homem-Maquina.webp", icon: "cpu", title: "Fusão Humano-Máquina", subtitle: "A IA como Coautora", desc: "A inteligência artificial deixa de ser ferramenta para atuar como tutora intelectual.", insight: "Tutores IA e Avatares monitoram o gap cognitivo individual. No entanto, o alerta pedagógico exige evitar a 'hiperindividualização': as IES devem preservar comunidades de prática (Earth School) e laboratórios coletivos para manter o elo social intacto.", source: "WEF / Revista Ensino Superior" }
            ]
        };

        const wefStats = [
            { label: "O Choque Algorítmico", value: "100%", sub: "Alta projetada na demanda por Analistas de IA e Especialistas em Big Data.", insight: "As posições técnicas hiper-especializadas disparam rumo a 2030, enquanto funções administrativas tradicionais, secretariado e digitação de dados despencam em ritmo sem precedentes.", source: "WEF - Future of Jobs 2025" },
            { label: "Upskilling Estratégico", value: "85%", sub: "Das organizações globais colocarão a requalificação no centro da estratégia.", insight: "Metade das empresas (50%) planeja transicionar ativamente funcionários de funções em declínio direto para as novas áreas tecnológicas, tratando a escassez de talentos como crise sistêmica.", source: "WEF - Future of Jobs 2025" },
            { label: "Ruptura Contínua", value: "39%", sub: "Das competências essenciais sofrerão obsolescência até o final da década.", insight: "A taxa caiu frente a 2023. Não porque a tecnologia desacelerou, mas porque os ecossistemas corporativos absorveram o choque: o aprendizado constante virou o novo status quo do mercado.", source: "WEF - Future of Jobs 2025" }
        ];

        // --- QUESTION CARD COMPONENT ---
        const QuestionCard = ({ number, title, question, context }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div onClick={() => setIsOpen(!isOpen)} className="bg-white p-6 md:p-8 rounded-3xl apple-shadow cursor-pointer border border-gray-100 group transition-all duration-300 hover:border-blue-200 h-full flex flex-col">
                    <div className="flex items-center justify-between mb-6">
                        <span className="text-4xl md:text-5xl font-extrabold text-gray-200 group-hover:text-blue-100 transition-colors duration-300">{number}</span>
                        <div className={`p-2 rounded-full transition-colors duration-300 ${isOpen ? 'bg-blue-600 text-white' : 'bg-gray-50 text-gray-400 group-hover:text-blue-500'}`}>
                            {isOpen ? <Icon icon="minus" size={18} /> : <Icon icon="plus" size={18} />}
                        </div>
                    </div>
                    <h3 className="text-lg md:text-xl font-bold text-[#1d1d1f] mb-3">{title}</h3>
                    <p className="text-[#86868b] text-sm leading-relaxed mb-4 flex-grow">{question}</p>
                    
                    <div className={`grid transition-all duration-500 ease-in-out mt-auto ${isOpen ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'}`}>
                        <div className="overflow-hidden">
                            <div className="pt-5 border-t border-gray-100 mt-2">
                                <div className="flex items-center gap-2 mb-2">
                                    <Icon icon="helpCircle" size={14} className="text-amber-500" />
                                    <h4 className="text-[11px] font-bold uppercase tracking-widest text-amber-500">O Ponto Cego</h4>
                                </div>
                                <p className="text-sm text-gray-700 leading-relaxed">{context}</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- UNANSWERED QUESTIONS DATA ---
        const unansweredData = [
            { number: "01", title: "O Limite da Regulação", question: "Como o Sistema Confea/Crea e o MEC certificarão competências que mudam a cada 6 meses?", context: "O estudo aponta a necessidade urgente de microcredenciais ágeis, mas não responde como a pesada estrutura regulatória brasileira conseguirá se adaptar em tempo real sem estrangular a inovação acadêmica ou precarizar o controle da profissão." },
            { number: "02", title: "Soberania vs. Dependência", question: "O Brasil será protagonista da Infraestrutura 4.0 ou apenas um exportador de 'commodities verdes'?", context: "Sabemos do imenso potencial do Nordeste para liderar a produção de Hidrogênio Verde. Mas o estudo não garante se teremos autonomia no hardware (chips/robótica), ou se seremos eternamente dependentes da tecnologia ciberfísica da China e dos EUA." },
            { number: "03", title: "O Novo Núcleo Humano", question: "Se a IA fará o design generativo, o cálculo estrutural e a previsão de falhas, qual é o trabalho real do engenheiro júnior em 2030?", context: "Fala-se exaustivamente em 'habilidades socioemocionais' e 'ética', mas ainda não há clareza empírica sobre a execução prática. O que exatamente as empresas vão exigir que o engenheiro recém-formado produza tangivelmente em seu primeiro ano de chão de fábrica?" },
            { number: "04", title: "A Bolha de Elite", question: "A fusão humano-máquina aprofundará de vez o abismo entre IES de elite e faculdades de massa?", context: "Instituições de ponta adotarão 'tutores IA' e 'Gêmeos Digitais', enquanto o ensino de massa brasileiro ainda sofre com a evasão por déficit severo em matemática básica. A tecnologia ainda não respondeu como democratizar o ensino do futuro no Brasil real." }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('nations');

            const tabs = [
                { id: 'nations', label: 'Nações & Polos', icon: 'globe' },
                { id: 'challenges', label: 'Desafios Críticos', icon: 'shieldAlert' },
                { id: 'gaps', label: 'Gaps Estruturais', icon: 'trendingDown' },
                { id: 'alternatives', label: 'Soluções Adotadas', icon: 'lightbulb' }
            ];

            return (
                <div className="w-full bg-[#f5f5f7] min-h-screen pb-24 font-sans selection:bg-blue-500 selection:text-white">
                    
                    {/* HERO BANNER (Cinematic + Glassmorphism) */}

                                    <span className="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                                    Inteligência Estratégica 2026-2030
                                </div>
                                <h1 className="text-5xl md:text-7xl font-extrabold tracking-tight text-white mb-6 leading-[1.05]">
                                    A Reinvenção <br/>das <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">Engenharias.</span>
                                </h1>
                                <p className="text-lg md:text-xl text-gray-300 font-light max-w-2xl leading-relaxed">
                                    Da geopolítica do talento global e transição ciberfísica até o apagão qualitativo. O mapa completo para navegar no ensino superior do futuro.
                                </p>
                            </div>
                        </div>
                    </div>

                    {/* INTRODUÇÃO EDITORIAL (STEVE JOBS STYLE) */}
                    <div className="max-w-4xl mx-auto px-6 mt-20 mb-24 text-center">
                        <h2 className="text-3xl md:text-4xl font-medium text-gray-900 leading-tight tracking-tight">
                            "A tecnologia não é o destino. É a ponte."

                        <p className="text-gray-500 mt-6 font-light text-lg md:text-xl leading-relaxed">

                                <p className="text-[#86868b] text-lg leading-relaxed font-light">

                                </p>

                                ))}
                            </div>
                            <p className="mt-6 text-xs text-center text-gray-400 font-medium">Nota: O relatório destaca o foco em requalificação como pilar de sobrevivência corporativa nesta década.</p>
                        </section>

                        <hr className="border-gray-200/60" />

                        {/* INTERACTIVE HUB (NAÇÕES, GAPS, DESAFIOS E ALTERNATIVAS) */}
                        <section className="scroll-mt-24">
                            <div className="mb-12 max-w-4xl">
                                <div className="flex items-center gap-3 mb-4">
                                    <Icon icon="layers" className="text-blue-600" size={28} />
                                    <h2 className="text-3xl md:text-4xl font-bold tracking-tight text-[#1d1d1f]">O Ecossistema Integrado.</h2>
                                </div>
                                <p className="text-[#86868b] text-lg font-light leading-relaxed mb-8">
                                    Mapeamos os quatro quadrantes que redefinem a educação e a indústria até 2030. De potências geopolíticas a soluções pedagógicas urgentes. A tecnologia é o meio; o talento é a revolução. <span className="font-medium text-gray-700">Selecione uma categoria abaixo.</span>
                                </p>

                                {/* TABS Navigation */}
                                <div className="flex flex-wrap gap-2 md:gap-3 bg-white p-2 rounded-2xl md:rounded-full shadow-sm border border-gray-100 w-fit">
                                    {tabs.map(tab => (
                                        <button
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className={`flex items-center gap-2 px-5 py-3 rounded-xl md:rounded-full text-sm font-semibold transition-all duration-300 ease-out
                                            ${activeTab === tab.id 
                                                ? 'bg-[#1d1d1f] text-white shadow-md transform scale-[1.02]' 
                                                : 'bg-transparent text-gray-500 hover:bg-gray-100 hover:text-gray-900'}`}
                                        >
                                            <Icon icon={tab.icon} size={18} />
                                            {tab.label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* TABS Content */}
                            <div className="bg-white/40 p-4 md:p-8 rounded-[3rem] border border-gray-200/60 shadow-sm relative min-h-[500px]">
                                {/* Dica visual interativa interna */}
                                <div className="absolute top-4 md:top-8 right-6 md:right-10 z-10 text-xs font-semibold tracking-widest text-blue-500 uppercase flex items-center gap-2 animate-pulse-soft bg-white px-3 py-1.5 rounded-full shadow-sm">
                                    <Icon icon="mousePointerClick" size={14} /> Detalhar
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pt-12 md:pt-0">
                                    {hubData[activeTab].map((item, idx) => (
                                    <div key={`${activeTab}-${idx}`} className="animate-[fadeIn_0.4s_ease-out]">
                                        <ImageCard {...item} />
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <hr className="border-gray-200/60" />

                    {/* FINAL SECTION: UNANSWERED QUESTIONS */}
                    <section className="scroll-mt-24 mb-8">
                        <div className="mb-14 max-w-4xl text-center mx-auto px-4">
                            <h2 className="text-3xl md:text-4xl font-bold tracking-tight text-[#1d1d1f] mb-6">O que não estamos perguntando?</h2>
                            <p className="text-[#86868b] text-lg font-light leading-relaxed">
                                Por mais aprofundados que sejam os mapeamentos globais e estatísticas do Fórum Econômico Mundial, desenhar o futuro exige reconhecer os nossos limites. Aqui estão os quatro grandes dilemas do cenário educacional brasileiro que o mercado <strong className="text-gray-800 font-medium">ainda não consegue responder com exatidão.</strong>
                            </p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            {unansweredData.map((item, idx) => (
                                <QuestionCard key={idx} {...item} />
                            ))}
                        </div>
                    </section>

                </div>
                
                <footer className="mt-32 pt-16 pb-8 border-t border-gray-200 bg-white text-center px-6">
                    <Icon icon="compass" className="mx-auto text-gray-300 mb-6" size={32} />
                        <h4 className="text-sm font-bold text-gray-800 uppercase tracking-widest mb-4">Arquitetura de Conhecimento</h4>
                        <div className="flex flex-wrap justify-center gap-2 text-[11px] text-gray-500 max-w-4xl mx-auto font-medium">
                            <span className="px-3 py-1.5 bg-[#f5f5f7] rounded-lg border border-gray-200 hover:border-blue-300 transition-colors cursor-default">WEF Future of Jobs (2025)</span>
                            <span className="px-3 py-1.5 bg-[#f5f5f7] rounded-lg border border-gray-200 hover:border-blue-300 transition-colors cursor-default">OCDE Learning Compass 2030</span>
                            <span className="px-3 py-1.5 bg-[#f5f5f7] rounded-lg border border-gray-200 hover:border-blue-300 transition-colors cursor-default">Mútua/Confea (2023)</span>
                            <span className="px-3 py-1.5 bg-[#f5f5f7] rounded-lg border border-gray-200 hover:border-blue-300 transition-colors cursor-default">Revista Ensino Superior (2025)</span>
                        </div>
                        <p className="text-[10px] text-gray-400 mt-8">Simples. Elegante. Profundo. Desenvolvido para liderar a transição educacional.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
